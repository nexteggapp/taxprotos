// Form 1098-E, Student Loan Interest Statement.
//
// A lender sends it when it received $600 or more of student loan interest from
// a borrower over the year.
//
// Boxes and Amount Codes are in mapping.textproto beside this file, keyed by
// tax year, per docs/form-schemas.md. Verified against the
// 2025 Form 1098-E box layout and the Instructions for Forms 1098-E and 1098-T
// (2026).
//
// On this form the payer is the lender and the recipient is the borrower, as on
// a Form 1098.
syntax = "proto3";

package nexteggapp.taxprotos.us.federal.v1;

import "taxprotos/common/v1/annotations.proto";
import "taxprotos/common/v1/money.proto";
import "taxprotos/common/v1/party.proto";

option go_package = "github.com/nexteggapp/taxprotos/us/federal/v1/form_1098_e;form1098e";

// Form1098E is what a Form 1098-E states.
message Form1098E {
  option (common.v1.fdx_entity) = "Tax1098E";
  option (common.v1.fdx_version) = "5.0";

  // The calendar year the form reports on, as four digits.
  int32 tax_year = 1 [(common.v1.fdx_field) = "taxYear"];

  // The lender that filed the form, printed as RECIPIENT/LENDER.
  nexteggapp.taxprotos.common.v1.Party lender = 2;

  // The borrower who paid the interest, printed as PAYER/BORROWER.
  nexteggapp.taxprotos.common.v1.Party borrower = 3;

  // The account number the form prints, where it has one. Text, because it
  // can carry leading zeroes and letters.
  string account_number = 4 [(common.v1.fdx_field) = "accountNumber"];

  // The form is marked CORRECTED, which means it replaces one already sent.
  bool corrected = 5 [(common.v1.fdx_field) = "corrected"];

  // One row per state the form reports withholding for.
  repeated nexteggapp.taxprotos.common.v1.StateTaxWithholding state_tax_withholding = 6 [(common.v1.fdx_field) = "stateTaxWithholding"];

  // Student loan interest received by the lender, box 1.
  nexteggapp.taxprotos.common.v1.Money student_loan_interest_received = 7 [
    (common.v1.fdx_field) = "studentLoanInterest"
  ];

  // The interest figure leaves out loan origination fees and capitalized
  // interest, which lenders may do for loans made before 1 September 2004. The
  // borrower may be able to deduct those separately.
  bool excludes_origination_fees_and_capitalized_interest = 8 [(common.v1.fdx_field) = "excludesFeesAndCapitalizedInterest"];
}
