// Form 8606, Nondeductible IRAs.
//
// Filed per individual to report nondeductible contributions to traditional
// IRAs, distributions from traditional IRAs when the taxpayer has basis,
// conversions to Roth IRAs, and distributions from Roth IRAs. "Traditional
// IRA" includes SEP and SIMPLE IRAs.
syntax = "proto3";

package nexteggapp.taxprotos.us.federal.v1;

import "taxprotos/common/v1/money.proto";
import "taxprotos/common/v1/quantity.proto";

option go_package = "github.com/nexteggapp/taxprotos/us/federal/v1/form_1040;form1040";

// Form8606 reports nondeductible IRA contributions, basis, Roth conversions, and IRA distributions.
message Form8606 {
  // The tax year the form applies to.
  int32 tax_year = 1;

  // Name of the individual filer (one Form 8606 per person).
  string individual_name = 2;

  // Social Security number of the individual.
  string individual_tin = 3;

  // -- Part I: Nondeductible Contributions to and Distributions From Traditional IRAs

  // Line 1: Nondeductible contributions to traditional IRAs for the year,
  // including those made in the following year up to the filing deadline.
  common.v1.Money nondeductible_traditional_ira_contributions = 4;

  // Line 2: Total basis in traditional IRAs carried in from earlier years.
  common.v1.Money prior_year_traditional_ira_basis = 5;

  // Line 3: Lines 1 and 2 added. With no distribution or conversion this
  // year, it carries to line 14.
  common.v1.Money total_basis_before_distributions = 6;

  // Line 4: Contributions on line 1 made between January 1 and the filing
  // deadline of the following year.
  common.v1.Money contributions_made_in_subsequent_year = 7;

  // Line 5: Line 4 subtracted from line 3.
  common.v1.Money basis_for_current_year_distributions = 8;

  // Line 6: Value of all traditional IRAs as of December 31, plus outstanding
  // rollovers, less certain retirement plan distribution repayments treated as
  // rollovers.
  common.v1.Money year_end_value_of_traditional_iras = 9;

  // Line 7: Distributions from traditional IRAs during the year, excluding
  // rollovers, qualified charitable distributions, HSA funding distributions,
  // conversions, recharacterizations and certain returned contributions.
  common.v1.Money traditional_ira_distributions = 10;

  // Line 8: Net amount converted from traditional IRAs to Roth IRAs during the
  // year. Also entered on line 16.
  common.v1.Money net_amount_converted_to_roth_iras = 11;

  // Line 9: Lines 6, 7 and 8 added.
  common.v1.Money total_ira_value_distributions_and_conversions = 12;

  // Line 10: Line 5 divided by line 9, as a decimal of at least three places
  // and no more than 1.000.
  common.v1.Quantity nontaxable_pro_rata_fraction = 13;

  // Line 11: Nontaxable portion of the amount converted to Roth IRAs (line 8
  // times line 10). Also entered on line 17.
  common.v1.Money nontaxable_portion_of_roth_conversions = 14;

  // Line 12: Nontaxable portion of distributions not converted to a Roth IRA
  // (line 7 times line 10).
  common.v1.Money nontaxable_portion_of_traditional_distributions = 15;

  // Line 13: Nontaxable portion of all distributions (lines 11 and 12 added).
  common.v1.Money total_basis_recovered = 16;

  // Line 14: Total basis in traditional IRAs for this year and earlier years
  // (line 13 subtracted from line 3).
  common.v1.Money remaining_traditional_ira_basis = 17;

  // Line 15a: Line 12 subtracted from line 7.
  common.v1.Money taxable_distributions_before_disaster = 18;

  // Line 15b: Amount on line 15a attributable to qualified disaster
  // distributions from Form 8915-F. Also entered on Form 8915-F line 18.
  common.v1.Money qualified_disaster_distribution_amount = 19;

  // Line 15c: Taxable amount of traditional IRA distributions (line 15b
  // subtracted from line 15a, less certain repayments treated as rollovers).
  // Included on Form 1040 line 4b.
  common.v1.Money taxable_traditional_ira_distributions = 20;

  // -- Part II: Conversions From Traditional IRAs to Roth IRAs ------------

  // Line 16: Net amount converted from traditional IRAs to Roth IRAs. Line 8
  // when Part I was completed.
  common.v1.Money net_roth_conversion_amount = 21;

  // Line 17: Basis in the amount on line 16. Line 11 when Part I was
  // completed.
  common.v1.Money basis_in_roth_conversion_amount = 22;

  // Line 18: Taxable amount of Roth IRA conversions (line 17 subtracted from
  // line 16). Included on Form 1040 line 4b.
  common.v1.Money taxable_roth_conversion_amount = 23;

  // -- Part III: Distributions From Roth IRAs ------------------------------

  // Line 19: Total nonqualified distributions from Roth IRAs during the year,
  // including qualified first-time homebuyer distributions.
  common.v1.Money nonqualified_roth_ira_distributions = 24;

  // Line 20: Qualified first-time homebuyer expenses, capped at the lifetime
  // limit less prior first-time homebuyer distributions.
  common.v1.Money qualified_first_time_homebuyer_expenses = 25;

  // Line 21: Line 20 subtracted from line 19, not less than zero.
  common.v1.Money roth_distributions_after_homebuyer_exclusion = 26;

  // Line 22: Basis in Roth IRA contributions.
  common.v1.Money basis_in_roth_ira_contributions = 27;

  // Line 23: Line 22 subtracted from line 21, not less than zero.
  common.v1.Money roth_distributions_exceeding_contribution_basis = 28;

  // Line 24: Basis in conversions from traditional IRAs and rollovers from
  // qualified retirement plans to a Roth IRA.
  common.v1.Money basis_in_roth_ira_conversions = 29;

  // Line 25a: Line 24 subtracted from line 23, not less than zero.
  common.v1.Money taxable_roth_distributions_before_disaster = 30;

  // Line 25b: Amount on line 25a attributable to qualified disaster
  // distributions from Form 8915-F. Also entered on Form 8915-F line 19.
  common.v1.Money roth_qualified_disaster_distribution_amount = 31;

  // Line 25c: Taxable amount of Roth IRA distributions (line 25b subtracted
  // from line 25a, less certain repayments treated as rollovers). Included on
  // Form 1040 line 4b.
  common.v1.Money taxable_roth_ira_distributions = 32;
}
