// Form 8959, Additional Medicare Tax.
//
// Used to figure the 0.9% Additional Medicare Tax on Medicare wages, Railroad
// Retirement Tax Act (RRTA) compensation, and self-employment income above
// statutory thresholds, and to reconcile Additional Medicare Tax withheld.
syntax = "proto3";

package nexteggapp.taxprotos.us.federal.v1;

import "taxprotos/common/v1/money.proto";

option go_package = "github.com/nexteggapp/taxprotos/us/federal/v1/form_1040;form1040";

// Form8959 reports the Additional Medicare Tax and withholding reconciliation across Parts I through V.
message Form8959 {
  // The tax year the form applies to.
  int32 tax_year = 1;

  // Name(s) shown on return.
  string filer_name = 2;

  // Social Security number of filer.
  string filer_tin = 3;

  // -- Part I: Additional Medicare Tax on Medicare Wages -------------------

  // Line 1: Medicare wages and tips from Form(s) W-2 box 5.
  common.v1.Money medicare_wages_and_tips = 4;

  // Line 2: Unreported tips from Form 4137 line 6.
  common.v1.Money unreported_tips = 5;

  // Line 3: Wages from Form 8919 line 6.
  common.v1.Money wages_from_form_8919 = 6;

  // Line 4: Total Medicare wages and tips (add lines 1 through 3).
  common.v1.Money total_medicare_wages = 7;

  // Line 5: Threshold amount based on filing status ($250,000 MFJ, $125,000 MFS, $200,000 Single/HOH/QSS).
  common.v1.Money medicare_wages_threshold = 8;

  // Line 6: Subtract line 5 from line 4 (if zero or less, enter 0).
  common.v1.Money medicare_wages_above_threshold = 9;

  // Line 7: Additional Medicare Tax on Medicare wages (multiply line 6 by 0.9% (0.009)).
  common.v1.Money additional_medicare_tax_on_wages = 10;

  // -- Part II: Additional Medicare Tax on Self-Employment Income ----------

  // Line 8: Self-employment income from Schedule SE Section A line 6 or Section B line 6.
  common.v1.Money self_employment_income = 11;

  // Line 9: Threshold amount based on filing status ($250,000 MFJ, $125,000 MFS, $200,000 Single/HOH/QSS).
  common.v1.Money self_employment_threshold = 12;

  // Line 10: Enter the amount from line 4 (total Medicare wages).
  common.v1.Money medicare_wages_reducing_se_threshold = 13;

  // Line 11: Subtract line 10 from line 9 (if zero or less, enter 0).
  common.v1.Money reduced_self_employment_threshold = 14;

  // Line 12: Subtract line 11 from line 8 (if zero or less, enter 0).
  common.v1.Money self_employment_income_above_threshold = 15;

  // Line 13: Additional Medicare Tax on self-employment income (multiply line 12 by 0.9% (0.009)).
  common.v1.Money additional_medicare_tax_on_self_employment = 16;

  // -- Part III: Additional Medicare Tax on RRTA Compensation --------------

  // Line 14: Railroad Retirement Tax Act (RRTA) compensation and tips from Form(s) W-2 box 14.
  common.v1.Money rrta_compensation_and_tips = 17;

  // Line 15: Threshold amount for RRTA compensation based on filing status.
  common.v1.Money rrta_threshold = 18;

  // Line 16: Subtract line 15 from line 14 (if zero or less, enter 0).
  common.v1.Money rrta_compensation_above_threshold = 19;

  // Line 17: Additional Medicare Tax on RRTA compensation (multiply line 16 by 0.9% (0.009)).
  common.v1.Money additional_medicare_tax_on_rrta = 20;

  // -- Part IV: Total Additional Medicare Tax ------------------------------

  // Line 18: Total Additional Medicare Tax (add lines 7, 13, and 17). Carries to Schedule 2 line 11.
  common.v1.Money total_additional_medicare_tax = 21;

  // -- Part V: Withholding Reconciliation ----------------------------------

  // Line 19: Medicare tax withheld from Form(s) W-2 box 6.
  common.v1.Money medicare_tax_withheld_on_w2 = 22;

  // Line 20: Enter the amount from line 1 (Medicare wages from Form(s) W-2 box 5).
  common.v1.Money w2_medicare_wages_for_reconciliation = 23;

  // Line 21: Multiply line 20 by 1.45% (0.0145) (regular Medicare tax on W-2 wages).
  common.v1.Money regular_medicare_tax_on_w2_wages = 24;

  // Line 22: Additional Medicare Tax withheld on W-2 wages (subtract line 21 from line 19; if zero or less, enter 0).
  common.v1.Money additional_medicare_tax_withheld_on_w2 = 25;

  // Line 23: Additional Medicare Tax withheld on RRTA compensation from Form(s) W-2 box 14.
  common.v1.Money additional_medicare_tax_withheld_on_rrta = 26;

  // Line 24: Total Additional Medicare Tax withheld (add lines 22 and 23). Carries to Form 1040 line 25c.
  common.v1.Money total_additional_medicare_tax_withheld = 27;
}
