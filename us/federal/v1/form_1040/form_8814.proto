// Form 8814, Parent's Election To Report Child's Interest and Dividends.
//
// Used by parents who elect to include their child's gross income (when derived
// solely from interest, dividends, and capital gain distributions under the
// statutory ceiling) on the parent's tax return instead of filing a separate
// return for the child.
syntax = "proto3";

package nexteggapp.taxprotos.us.federal.v1;

import "taxprotos/common/v1/money.proto";
import "taxprotos/common/v1/quantity.proto";

option go_package = "github.com/nexteggapp/taxprotos/us/federal/v1/form_1040;form1040";

// Form8814 reports a parent's election to report a child's interest and dividends across Parts I and II.
message Form8814 {
  // The tax year the form applies to.
  int32 tax_year = 1;

  // Name(s) shown on parent's return.
  string parent_name = 2;

  // Parent's Social Security number.
  string parent_tin = 3;

  // Line A: Child's name (first, initial, and last).
  string child_name = 4;

  // Line B: Child's Social Security number.
  string child_tin = 5;

  // Line C: More than one Form 8814 is attached.
  bool multiple_forms_8814_filed = 6;

  // -- Part I: Child's Interest and Dividends To Report on Your Return -----

  // Line 1a: Child's taxable interest.
  common.v1.Money child_taxable_interest = 7;

  // Line 1b: Child's tax-exempt interest. Not included on line 1a.
  common.v1.Money child_tax_exempt_interest = 8;

  // Line 2a: Child's ordinary dividends, including any Alaska Permanent Fund
  // dividends.
  common.v1.Money child_ordinary_dividends = 9;

  // Line 2b: Child's qualified dividends included on line 2a.
  common.v1.Money child_qualified_dividends = 10;

  // Line 3: Child's capital gain distributions.
  common.v1.Money child_capital_gain_distributions = 11;

  // Line 4: Lines 1a, 2a and 3 added. At or below the base amount, lines 5
  // through 12 are skipped; at or above the election ceiling, the form cannot
  // be filed.
  common.v1.Money total_child_income = 12;

  // Line 5: The base amount the form prints for the year.
  common.v1.Money base_amount = 13;

  // Line 6: Line 5 subtracted from line 4.
  common.v1.Money income_above_base_amount = 14;

  // Line 7: Line 2b divided by line 4, as a decimal of at least three places.
  common.v1.Quantity qualified_dividends_fraction = 15;

  // Line 8: Line 3 divided by line 4, as a decimal of at least three places.
  common.v1.Quantity capital_gain_distributions_fraction = 16;

  // Line 9: Line 6 times line 7. The qualified dividends reported on the
  // parent's return, where the instructions direct.
  common.v1.Money parent_included_qualified_dividends = 17;

  // Line 10: Line 6 times line 8. The capital gain distributions reported on
  // the parent's return, where the instructions direct.
  common.v1.Money parent_included_capital_gain_distributions = 18;

  // Line 11: Lines 9 and 10 added. Zero when lines 2b and 3 are both zero or
  // blank.
  common.v1.Money total_preferential_income_included = 19;

  // Line 12: Line 11 subtracted from line 6. Included in Schedule 1 (Form
  // 1040) line 8z.
  common.v1.Money parent_included_ordinary_income = 20;

  // -- Part II: Tax on the Child's Income up to the Base Amount ------------

  // Line 13: The amount not taxed that the form prints for the year.
  common.v1.Money amount_not_taxed = 21;

  // Line 14: Line 13 subtracted from line 4, not less than zero.
  common.v1.Money child_income_above_amount_not_taxed = 22;

  // Line 15: Tax on line 14 at the child's rate, capped at the amount the form
  // prints. Included in the tax on Form 1040 line 16, with box 1 (Form 8814)
  // checked.
  common.v1.Money tax_on_child_income = 23;
}
