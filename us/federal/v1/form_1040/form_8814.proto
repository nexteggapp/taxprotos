// Form 8814, Parent's Election To Report Child's Interest and Dividends.
//
// Used by parents who elect to include their child's gross income (when derived
// solely from interest, dividends, and capital gain distributions under the
// statutory ceiling) on the parent's tax return instead of filing a separate
// return for the child.
syntax = "proto3";

package nexteggapp.taxprotos.us.federal.v1;

import "taxprotos/common/v1/money.proto";

option go_package = "github.com/nexteggapp/taxprotos/us/federal/v1/form_1040;form1040";

// Form8814 reports a parent's election to report a child's interest and dividends across Parts I and II.
message Form8814 {
  // The tax year the form applies to.
  int32 tax_year = 1;

  // Name(s) shown on parent's return.
  string parent_name = 2;

  // Parent's Social Security number.
  string parent_tin = 3;

  // Line A: Child's name (first, initial, and last).
  string child_name = 4;

  // Line B: Child's Social Security number.
  string child_tin = 5;

  // Line C: Check if filing more than one Form 8814.
  bool multiple_forms_8814_filed = 6;

  // -- Part I: Child's Interest and Dividends To Report on Your Return -----

  // Line 1a: Child's taxable interest.
  common.v1.Money child_taxable_interest = 7;

  // Line 1b: Child's tax-exempt interest (including specified private activity bond interest).
  common.v1.Money child_tax_exempt_interest = 8;

  // Line 2a: Child's total ordinary dividends.
  common.v1.Money child_ordinary_dividends = 9;

  // Line 2b: Child's qualified dividends included on line 2a.
  common.v1.Money child_qualified_dividends = 10;

  // Line 3: Child's total capital gain distributions (Form 1099-DIV box 2a, excluding 2b/2c/2d).
  common.v1.Money child_capital_gain_distributions = 11;

  // Line 4: Add lines 1a, 2a, and 3 (total child's gross income).
  common.v1.Money total_child_income = 12;

  // Line 5: Base amount ($2,700 for 2025: twice the child standard deduction).
  common.v1.Money base_exclusion_amount = 13;

  // Line 6: Subtract line 5 from line 4 (if zero or less, enter 0).
  common.v1.Money income_above_base_amount = 14;

  // Line 9: Qualified dividends portion of line 6 included on parent's Form 1040 line 3a.
  common.v1.Money parent_included_qualified_dividends = 15;

  // Line 10: Capital gain distributions portion of line 6 included on parent's Schedule D line 13 / Form 1040 line 7.
  common.v1.Money parent_included_capital_gain_distributions = 16;

  // Line 11: Add lines 9 and 10.
  common.v1.Money total_preferential_income_included = 17;

  // Line 12: Ordinary income portion (subtract line 11 from line 6). Carries to Schedule 1 line 8z.
  common.v1.Money parent_included_ordinary_income = 18;

  // -- Part II: Tax on the First $1,350 of Child's Interest and Dividends --

  // Line 13: Standard deduction base ($1,350 for 2025).
  common.v1.Money child_standard_deduction_base = 19;

  // Line 14: Subtract line 13 from line 4 (if zero or less, enter 0).
  common.v1.Money amount_subject_to_ten_percent_bracket = 20;

  // Line 15: Tax on first bracket of child's income (10% of line 14, up to $135). Carries to Form 1040 line 16 (Form 8814 checkbox).
  common.v1.Money child_ten_percent_bracket_tax = 21;
}
