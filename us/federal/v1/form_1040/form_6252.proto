// Form 6252, Installment Sale Income.
//
// Used to report income from casual sales of real or personal property (other
// than inventory) under the installment method where at least one payment is
// received after the close of the tax year in which the sale occurs. One form
// per sale.
syntax = "proto3";

package nexteggapp.taxprotos.us.federal.v1;

import "taxprotos/common/v1/date.proto";
import "taxprotos/common/v1/money.proto";
import "taxprotos/common/v1/quantity.proto";

option go_package = "github.com/nexteggapp/taxprotos/us/federal/v1/form_1040;form1040";

// Form6252 reports installment sale gross profit, contract price, and current-year installment income.
message Form6252 {
  // SecondDispositionException is the line 29 condition under which a related
  // party's second disposition does not trigger lines 30 through 37.
  enum SecondDispositionException {
    // No box checked.
    SECOND_DISPOSITION_EXCEPTION_UNSPECIFIED = 0;

    // Box a: the second disposition came long enough after the first, as the form states.
    SECOND_DISPOSITION_EXCEPTION_LATE_SECOND_DISPOSITION = 1;

    // Box b: the first disposition was a sale or exchange of stock to the issuing corporation.
    SECOND_DISPOSITION_EXCEPTION_STOCK_TO_ISSUER = 2;

    // Box c: the second disposition was an involuntary conversion threatened after the first disposition.
    SECOND_DISPOSITION_EXCEPTION_INVOLUNTARY_CONVERSION = 3;

    // Box d: the second disposition occurred after the death of the original seller or buyer.
    SECOND_DISPOSITION_EXCEPTION_AFTER_DEATH = 4;

    // Box e: tax avoidance was not a principal purpose of either disposition.
    SECOND_DISPOSITION_EXCEPTION_NO_TAX_AVOIDANCE = 5;
  }

  // The tax year the form applies to.
  int32 tax_year = 1;

  // Name(s) shown on return.
  string filer_name = 2;

  // Identifying number (SSN or EIN).
  string filer_tin = 3;

  // Line 1: Description of property.
  string property_description = 4;

  // Line 2a: Date acquired.
  common.v1.Date date_acquired = 5;

  // Line 2b: Date sold.
  common.v1.Date date_sold = 6;

  // Line 3: Whether the property was sold to a related party.
  bool sold_to_related_party = 7;

  // Line 4: Whether the total selling price can be determined by the close of the tax year of the sale.
  bool selling_price_determinable = 8;

  // -- Part I: Gross Profit and Contract Price -----------------------------

  // Line 5: Selling price including mortgages and other debts, excluding interest.
  common.v1.Money selling_price = 9;

  // Line 6: Mortgages, debts, and other liabilities the buyer assumed or took the property subject to.
  common.v1.Money mortgages_and_debts_assumed = 10;

  // Line 7: Line 5 minus line 6.
  common.v1.Money net_selling_price = 11;

  // Line 8: Cost or other basis of property sold.
  common.v1.Money cost_or_other_basis = 12;

  // Line 9: Depreciation allowed or allowable.
  common.v1.Money depreciation_allowed_or_allowable = 13;

  // Line 10: Adjusted basis (line 8 minus line 9).
  common.v1.Money adjusted_basis = 14;

  // Line 11: Commissions and other expenses of sale.
  common.v1.Money commissions_and_expenses_of_sale = 15;

  // Line 12: Income recapture from Form 4797 Part III.
  common.v1.Money depreciation_recapture_income = 16;

  // Line 13: Lines 10, 11, and 12.
  common.v1.Money total_basis_expenses_and_recapture = 17;

  // Line 14: Line 5 minus line 13.
  common.v1.Money profit_before_home_exclusion = 18;

  // Line 15: Excluded gain, if the property was the main home.
  common.v1.Money excluded_main_home_gain = 19;

  // Line 16: Gross profit (line 14 minus line 15).
  common.v1.Money gross_profit = 20;

  // Line 17: Line 6 minus line 13, not less than zero.
  common.v1.Money excess_mortgage_over_basis = 21;

  // Line 18: Contract price (lines 7 and 17).
  common.v1.Money contract_price = 22;

  // -- Part II: Installment Sale Income ------------------------------------

  // Line 19: Gross profit percentage, as a decimal (line 16 divided by line 18 in the year of sale).
  common.v1.Quantity gross_profit_percentage = 23;

  // Line 20: Amount from line 17 in the year of sale, otherwise zero.
  common.v1.Money year_of_sale_excess_mortgage = 24;

  // Line 21: Payments received during the year, excluding interest.
  common.v1.Money payments_received_in_year = 25;

  // Line 22: Lines 20 and 21.
  common.v1.Money total_current_year_payments = 26;

  // Line 23: Payments received in prior years, excluding interest.
  common.v1.Money prior_years_payments_received = 27;

  // Line 24: Installment sale income (line 22 times line 19), not less than zero.
  common.v1.Money installment_sale_income = 28;

  // Line 25: Part of line 24 that is ordinary income under the recapture rules.
  common.v1.Money ordinary_recapture_portion = 29;

  // Line 26: Line 24 minus line 25. Carries to Schedule D or Form 4797.
  common.v1.Money capital_or_section_1231_gain_portion = 30;

  // -- Part III: Related Party Installment Sale Income ---------------------

  // Line 27: Name, address, and taxpayer identifying number of the related party.
  string related_party_name_address_and_tin = 31;

  // Line 28: Whether the related party resold or disposed of the property during this tax year.
  bool related_party_disposed_in_year = 32;

  // Line 29: Which exception box is checked, if any.
  SecondDispositionException second_disposition_exception = 33;

  // Line 29a: Date of the second disposition, when box a is checked.
  common.v1.Date second_disposition_date = 34;

  // Line 30: Selling price of property sold by the related party.
  common.v1.Money related_party_selling_price = 35;

  // Line 31: Contract price from line 18 for the year of the first sale.
  common.v1.Money first_sale_contract_price = 36;

  // Line 32: Smaller of line 30 or line 31.
  common.v1.Money related_party_amount_realized_limited = 37;

  // Line 33: Total payments received by the end of this tax year.
  common.v1.Money total_payments_received_to_date = 38;

  // Line 34: Line 32 minus line 33, not less than zero.
  common.v1.Money related_party_deemed_payment = 39;

  // Line 35: Line 34 times the gross profit percentage on line 19 for the year of the first sale.
  common.v1.Money related_party_installment_income = 40;

  // Line 36: Part of line 35 that is ordinary income under the recapture rules.
  common.v1.Money related_party_ordinary_recapture_portion = 41;

  // Line 37: Line 35 minus line 36. Carries to Schedule D or Form 4797.
  common.v1.Money related_party_capital_or_section_1231_gain_portion = 42;
}
