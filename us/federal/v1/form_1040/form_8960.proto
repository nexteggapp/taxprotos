// Form 8960, Net Investment Income Tax—Individuals, Estates, and Trusts.
//
// Used to figure the Net Investment Income Tax (NIIT) under section 1411 on the
// smaller of net investment income and the excess of modified adjusted gross
// income over a threshold set by filing status.
//
// Only the individual lines are modelled. Lines 18a through 21 are for estates
// and trusts, which do not file Form 1040.
syntax = "proto3";

package nexteggapp.taxprotos.us.federal.v1;

import "taxprotos/common/v1/money.proto";

option go_package = "github.com/nexteggapp/taxprotos/us/federal/v1/form_1040;form1040";

// Form8960 reports an individual's Net Investment Income Tax.
message Form8960 {
  // The tax year the form applies to.
  int32 tax_year = 1;

  // Name(s) shown on return.
  string filer_name = 2;

  // Social security number or EIN of the filer.
  string filer_tin = 3;

  // Part I checkbox: Section 6013(g) election.
  bool section_6013g_election = 4;

  // Part I checkbox: Section 6013(h) election.
  bool section_6013h_election = 5;

  // Part I checkbox: Regulations section 1.1411-10(g) election.
  bool regulations_1411_10g_election = 6;

  // -- Part I: Investment Income -------------------------------------------

  // Line 1: Taxable interest.
  common.v1.Money taxable_interest = 7;

  // Line 2: Ordinary dividends.
  common.v1.Money ordinary_dividends = 8;

  // Line 3: Annuities, other than from qualified plans.
  common.v1.Money nonqualified_annuities = 9;

  // Line 4a: Rental real estate, royalties, partnerships, S corporations,
  // trusts, trades or businesses, etc.
  common.v1.Money rental_royalty_and_passthrough_income = 10;

  // Line 4b: Adjustment for net income or loss derived in the ordinary course
  // of a non-section 1411 trade or business.
  common.v1.Money nonpassive_trade_or_business_adjustment = 11;

  // Line 4c: Lines 4a and 4b combined.
  common.v1.Money net_passive_and_rental_income = 12;

  // Line 5a: Net gain or loss from disposition of property.
  common.v1.Money net_gain_or_loss_from_dispositions = 13;

  // Line 5b: Net gain or loss from disposition of property that is not
  // subject to net investment income tax.
  common.v1.Money excluded_active_business_disposition_gain_or_loss = 14;

  // Line 5c: Adjustment from disposition of partnership interest or S
  // corporation stock.
  common.v1.Money passthrough_interest_disposition_adjustment = 15;

  // Line 5d: Lines 5a through 5c combined.
  common.v1.Money net_investment_gain_or_loss_from_dispositions = 16;

  // Line 6: Adjustments to investment income for certain CFCs and PFICs.
  common.v1.Money cfc_and_pfic_adjustments = 17;

  // Line 7: Other modifications to investment income.
  common.v1.Money other_investment_income_modifications = 18;

  // Line 8: Total investment income, lines 1, 2, 3, 4c, 5d, 6 and 7 combined.
  common.v1.Money total_investment_income = 19;

  // -- Part II: Investment Expenses Allocable to Investment Income ---------

  // Line 9a: Investment interest expenses.
  common.v1.Money investment_interest_expense = 20;

  // Line 9b: State, local and foreign income tax.
  common.v1.Money allocable_state_local_and_foreign_income_tax = 21;

  // Line 9c: Miscellaneous investment expenses.
  common.v1.Money miscellaneous_investment_expenses = 22;

  // Line 9d: Lines 9a, 9b and 9c added.
  common.v1.Money subtotal_investment_expenses = 23;

  // Line 10: Additional modifications.
  common.v1.Money additional_investment_expense_modifications = 24;

  // Line 11: Total deductions and modifications, lines 9d and 10 added.
  common.v1.Money total_investment_deductions_and_modifications = 25;

  // -- Part III: Tax Computation -------------------------------------------

  // Line 12: Net investment income, line 8 minus line 11, not less than zero.
  common.v1.Money net_investment_income = 26;

  // Line 13: Modified adjusted gross income.
  common.v1.Money modified_adjusted_gross_income = 27;

  // Line 14: Threshold based on filing status.
  common.v1.Money threshold_amount = 28;

  // Line 15: Line 13 minus line 14, not less than zero.
  common.v1.Money magi_above_threshold = 29;

  // Line 16: The smaller of lines 12 and 15.
  common.v1.Money amount_subject_to_niit = 30;

  // Line 17: Net investment income tax for individuals, line 16 multiplied by
  // the tax rate. Carries to Schedule 2 line 12.
  common.v1.Money net_investment_income_tax = 31;
}
