// Form 4684, Casualties and Thefts.
//
// Section A is used to figure gains and losses from casualties and thefts of
// personal-use property (including federally declared disasters and qualified
// disaster losses). Section B is used for business and income-producing
// property.
syntax = "proto3";

package nexteggapp.taxprotos.us.federal.v1;

import "taxprotos/common/v1/date.proto";
import "taxprotos/common/v1/money.proto";

option go_package = "github.com/nexteggapp/taxprotos/us/federal/v1/form_1040;form1040";

// Form4684 reports casualty and theft gains and losses for personal-use property (Section A) and business/income-producing property (Section B).
message Form4684 {
  // PersonalPropertyItem represents one property damaged or stolen in a single casualty or theft event in Section A (lines 1 through 9).
  message PersonalPropertyItem {
    // Line 1: Description of property (type, location, and date acquired).
    string property_description = 1;

    // Line 2: Cost or other basis of each property.
    common.v1.Money cost_or_other_basis = 2;

    // Line 3: Insurance or other reimbursement (whether or not a claim was filed).
    common.v1.Money insurance_or_other_reimbursement = 3;

    // Line 4: Gain from casualty or theft (if line 3 is more than line 2, subtract line 2 from line 3).
    common.v1.Money gain_from_casualty_or_theft = 4;

    // Line 5: Fair market value before casualty or theft.
    common.v1.Money fmv_before = 5;

    // Line 6: Fair market value after casualty or theft.
    common.v1.Money fmv_after = 6;

    // Line 7: Subtract line 6 from line 5 (decrease in fair market value).
    common.v1.Money decrease_in_fmv = 7;

    // Line 8: Smaller of line 2 or line 7.
    common.v1.Money smaller_of_basis_or_decrease_in_fmv = 8;

    // Line 9: Subtract line 3 from line 8 (if zero or less, enter 0: property casualty/theft loss).
    common.v1.Money unadjusted_property_loss = 9;
  }

  // The tax year the form applies to.
  int32 tax_year = 1;

  // Name(s) shown on return.
  string filer_name = 2;

  // Identifying number (SSN or EIN).
  string filer_tin = 3;

  // -- Section A: Personal-Use Property ------------------------------------

  // FEMA disaster declaration number (e.g., "DR-XXXX-XX" or "EM-XXXX-XX").
  string fema_disaster_declaration_number = 4;

  // Date of casualty or theft event.
  common.v1.Date date_of_event = 5;

  // Whether the loss is a Qualified Disaster Loss eligible for the $500 per-event floor and no 10%-of-AGI reduction.
  bool is_qualified_disaster_loss = 6;

  // Properties affected by the casualty or theft event (lines 1 through 9).
  repeated PersonalPropertyItem personal_properties = 7;

  // Line 10: Total casualty or theft loss across all properties in the event (sum of line 9 amounts).
  common.v1.Money total_event_loss_before_floor = 8;

  // Line 11: Per-event dollar floor ($100 regular casualty/theft floor, or $500 for a qualified disaster loss).
  common.v1.Money per_event_dollar_floor = 9;

  // Line 12: Subtract line 11 from line 10 (if zero or less, enter 0).
  common.v1.Money event_loss_after_dollar_floor = 10;

  // Line 13: Total of line 12 amounts from all Form(s) 4684 for the year.
  common.v1.Money total_losses_from_all_events = 11;

  // Line 14: Total casualty or theft gains from all events (sum of line 4 amounts).
  common.v1.Money total_casualty_or_theft_gains = 12;

  // Line 15: Net casualty or theft gain or deductible qualified disaster loss ( carried to Schedule D or Schedule A line 15 / Schedule 1-A).
  common.v1.Money net_gain_or_qualified_disaster_loss = 13;

  // Line 16: Subtract line 14 and line 15 (qualified disaster losses) from line 13 (remaining personal casualty losses subject to 10% AGI limit).
  common.v1.Money losses_subject_to_agi_floor = 14;

  // Line 17: 10% of adjusted gross income (Form 1040 line 11).
  common.v1.Money ten_percent_of_agi = 15;

  // Line 18: Deductible personal casualty and theft loss after 10% AGI floor (subtract line 17 from line 16; if zero or less, enter 0). Carries to Schedule A line 15.
  common.v1.Money deductible_personal_casualty_loss = 16;

  // -- Section B Summary: Business and Income-Producing Property -----------

  // Line 31: Net ordinary loss from business/income-producing casualties and thefts (carries to Form 4797 line 13 or Schedule A).
  common.v1.Money section_b_net_ordinary_gain_or_loss = 17;

  // Line 39: Net long-term Section 1231 casualty/theft gain (carries to Form 4797 line 3).
  common.v1.Money section_b_net_long_term_gain = 18;
}
