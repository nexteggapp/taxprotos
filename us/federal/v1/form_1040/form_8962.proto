// Form 8962, Premium Tax Credit (PTC).
//
// Used to figure the Premium Tax Credit (PTC) and reconcile it with any
// advance payment of the premium tax credit (APTC) reported on Form 1095-A.
syntax = "proto3";

package nexteggapp.taxprotos.us.federal.v1;

import "taxprotos/common/v1/money.proto";
import "taxprotos/common/v1/quantity.proto";

option go_package = "github.com/nexteggapp/taxprotos/us/federal/v1/form_1040;form1040";

// Form8962 reports the Premium Tax Credit and reconciles advance payments.
message Form8962 {
  // MonthlyCalculationRow is one month of Part II, lines 12 (January) through
  // 23 (December).
  message MonthlyCalculationRow {
    // Calendar month, 1 for January through 12 for December.
    int32 month = 1;

    // Column (a): Monthly enrollment premiums, from Form(s) 1095-A lines 21-32
    // column A.
    common.v1.Money monthly_enrollment_premiums = 2;

    // Column (b): Monthly applicable SLCSP premium, from Form(s) 1095-A lines
    // 21-32 column B.
    common.v1.Money monthly_slcsp_premium = 3;

    // Column (c): Monthly contribution amount, from line 8b or the alternative
    // marriage monthly calculation.
    common.v1.Money monthly_contribution_amount = 4;

    // Column (d): Monthly maximum premium assistance, column (b) minus column
    // (c), not less than zero.
    common.v1.Money monthly_maximum_premium_assistance = 5;

    // Column (e): Monthly PTC allowed, the smaller of columns (a) and (d).
    common.v1.Money monthly_premium_tax_credit_allowed = 6;

    // Column (f): Monthly advance payment of PTC, from Form(s) 1095-A lines
    // 21-32 column C.
    common.v1.Money monthly_advance_ptc = 7;
  }

  // SharedPolicyAllocation is one policy amount allocation in Part IV, lines
  // 30 through 33.
  message SharedPolicyAllocation {
    // Column (a): Policy number, from Form 1095-A line 2.
    string policy_number = 1;

    // Column (b): SSN of the other taxpayer.
    string other_taxpayer_ssn = 2;

    // Column (c): Allocation start month, 1 through 12.
    int32 start_month = 3;

    // Column (d): Allocation stop month, 1 through 12.
    int32 stop_month = 4;

    // Column (e): Premium percentage.
    common.v1.Quantity premium_allocation_percentage = 5;

    // Column (f): SLCSP percentage.
    common.v1.Quantity slcsp_allocation_percentage = 6;

    // Column (g): Advance payment of the PTC percentage.
    common.v1.Quantity aptc_allocation_percentage = 7;
  }

  // The tax year the form applies to.
  int32 tax_year = 1;

  // Name shown on the return.
  string filer_name = 2;

  // Social security number of the filer.
  string filer_tin = 3;

  // Checkbox A: The filer is married filing separately and qualifies for an
  // exception that allows the PTC.
  bool married_filing_separately_exception = 4;

  // -- Part I: Annual and Monthly Contribution Amount ----------------------

  // Line 1: Tax family size.
  int32 tax_family_size = 5;

  // Line 2a: Modified AGI of the filer, and spouse if filing jointly.
  common.v1.Money taxpayer_modified_agi = 6;

  // Line 2b: Total of the dependents' modified AGI.
  common.v1.Money dependents_modified_agi = 7;

  // Line 3: Household income, lines 2a and 2b added.
  common.v1.Money household_income = 8;

  // Line 4: Federal poverty line amount from Table 1-1, 1-2 or 1-3 in the
  // instructions.
  common.v1.Money federal_poverty_line_amount = 9;

  // Line 4 checkbox: Which federal poverty table was used: "Alaska" (box a),
  // "Hawaii" (box b) or "Other 48 states and DC" (box c).
  string poverty_line_state_category = 10;

  // Line 5: Household income as a whole percentage of the federal poverty
  // line.
  int32 household_income_fpl_percentage = 11;

  // Line 7: Applicable figure from the table in the instructions, located by
  // the line 5 percentage.
  common.v1.Quantity applicable_figure = 12;

  // Line 8a: Annual contribution amount, line 3 multiplied by line 7 and
  // rounded to the nearest whole dollar.
  common.v1.Money annual_contribution_amount = 13;

  // Line 8b: Monthly contribution amount, line 8a divided by 12 and rounded to
  // the nearest whole dollar.
  common.v1.Money monthly_contribution_amount = 14;

  // -- Part II: Premium Tax Credit Claim and Reconciliation of APTC --------

  // Line 9: Whether the filer is allocating policy amounts with another
  // taxpayer or using the alternative calculation for year of marriage.
  bool allocating_policy_or_alternative_marriage_calculation = 15;

  // Line 10: Whether the instructions allow the annual calculation on line 11
  // instead of the monthly calculation on lines 12 through 23.
  bool uses_annual_calculation = 16;

  // Line 11 column (a): Annual enrollment premiums, from Form(s) 1095-A line
  // 33A.
  common.v1.Money annual_enrollment_premiums = 17;

  // Line 11 column (b): Annual applicable SLCSP premium, from Form(s) 1095-A
  // line 33B.
  common.v1.Money annual_slcsp_premium = 18;

  // Line 11 column (c): Annual contribution amount, from line 8a.
  common.v1.Money annual_contribution_column_c = 19;

  // Line 11 column (d): Annual maximum premium assistance, column (b) minus
  // column (c), not less than zero.
  common.v1.Money annual_maximum_premium_assistance = 20;

  // Line 11 column (e): Annual PTC allowed, the smaller of columns (a) and
  // (d).
  common.v1.Money annual_premium_tax_credit_allowed = 21;

  // Line 11 column (f): Annual advance payment of PTC, from Form(s) 1095-A
  // line 33C.
  common.v1.Money annual_advance_ptc = 22;

  // Lines 12 through 23: The monthly calculation, one row per month, used
  // when line 10 is "No".
  repeated MonthlyCalculationRow monthly_rows = 23;

  // Line 24: Total PTC, from line 11 column (e) or the total of lines 12
  // through 23 column (e).
  common.v1.Money total_premium_tax_credit = 24;

  // Line 25: Advance payment of PTC, from line 11 column (f) or the total of
  // lines 12 through 23 column (f).
  common.v1.Money total_advance_ptc = 25;

  // Line 26: Net PTC, line 24 minus line 25 when line 24 is greater. Carries
  // to Schedule 3 line 9.
  common.v1.Money net_premium_tax_credit = 26;

  // -- Part III: Repayment of Excess Advance Payment of the PTC ------------

  // Line 27: Excess advance payment of PTC, line 25 minus line 24 when line 25
  // is greater.
  common.v1.Money excess_advance_ptc = 27;

  // Line 28: Repayment limitation, from the instructions.
  common.v1.Money repayment_limitation = 28;

  // Line 29: Excess advance PTC repayment, the smaller of lines 27 and 28.
  // Carries to Schedule 2 line 1a.
  common.v1.Money excess_advance_ptc_repayment = 29;

  // -- Part IV: Allocation of Policy Amounts -------------------------------

  // Lines 30 through 33: Up to four policy amount allocations.
  repeated SharedPolicyAllocation shared_policy_allocations = 30;

  // Line 34: Whether all policy amount allocations are complete.
  bool completed_shared_policy_allocations = 31;

  // -- Part V: Alternative Calculation for Year of Marriage ----------------

  // Line 35 column (a): Alternative family size for the filer's SSN.
  int32 alternative_taxpayer_family_size = 32;

  // Line 35 column (b): Alternative monthly contribution amount for the
  // filer's SSN.
  common.v1.Money alternative_taxpayer_monthly_contribution = 33;

  // Line 35 column (c): Alternative start month for the filer's SSN.
  int32 alternative_taxpayer_start_month = 34;

  // Line 35 column (d): Alternative stop month for the filer's SSN.
  int32 alternative_taxpayer_stop_month = 35;

  // Line 36 column (a): Alternative family size for the spouse's SSN.
  int32 alternative_spouse_family_size = 36;

  // Line 36 column (b): Alternative monthly contribution amount for the
  // spouse's SSN.
  common.v1.Money alternative_spouse_monthly_contribution = 37;

  // Line 36 column (c): Alternative start month for the spouse's SSN.
  int32 alternative_spouse_start_month = 38;

  // Line 36 column (d): Alternative stop month for the spouse's SSN.
  int32 alternative_spouse_stop_month = 39;
}
