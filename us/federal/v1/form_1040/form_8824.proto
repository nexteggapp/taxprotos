// Form 8824, Like-Kind Exchanges (and Section 1043 Conflict-of-Interest Sales).
//
// Used to report each exchange of business or investment real property for
// real property of a like kind under IRC section 1031, and the deferral of gain
// on a sale under section 1043 to meet federal conflict-of-interest rules.
syntax = "proto3";

package nexteggapp.taxprotos.us.federal.v1;

import "taxprotos/common/v1/date.proto";
import "taxprotos/common/v1/money.proto";

option go_package = "github.com/nexteggapp/taxprotos/us/federal/v1/form_1040;form1040";

// Form8824 reports one like-kind exchange across Parts I to III, and a
// section 1043 conflict-of-interest sale in Part IV.
message Form8824 {
  // The tax year the form applies to.
  int32 tax_year = 1;

  // Name(s) shown on return.
  string filer_name = 2;

  // Identifying number (SSN or EIN).
  string filer_tin = 3;

  // -- Part I: Information on the Like-Kind Exchange -----------------------

  // Line 1: Description of the like-kind property given up, with its country
  // when it is real property outside the United States.
  string relinquished_property_description = 4;

  // Line 2: Description of the like-kind property received, with its country
  // when it is real property outside the United States.
  string replacement_property_description = 5;

  // Line 3: Date the like-kind property given up was originally acquired.
  common.v1.Date date_relinquished_property_acquired = 6;

  // Line 4: Date the property was actually transferred to the other party.
  common.v1.Date date_relinquished_property_transferred = 7;

  // Line 5: Date the like-kind property received was identified by written
  // notice to another party.
  common.v1.Date date_replacement_property_identified = 8;

  // Line 6: Date the like-kind property was actually received from the other
  // party.
  common.v1.Date date_replacement_property_received = 9;

  // Line 7: The exchange was made with a related party, directly or
  // indirectly.
  bool exchange_with_related_party = 10;

  // -- Part II: Related Party Exchange Information -------------------------

  // Line 8: Name of the related party.
  string related_party_name = 11;

  // Line 8: The related party's relationship to the filer.
  string related_party_relationship = 12;

  // Line 8: The related party's identifying number.
  string related_party_tin = 13;

  // Line 8: The related party's address.
  string related_party_address = 14;

  // Line 9: During this tax year, and within the related-party holding period
  // after the last transfer, the related party sold or disposed of property
  // received in the exchange.
  bool related_party_disposed_of_property = 15;

  // Line 10: During this tax year, and within the related-party holding
  // period after the last transfer, the filer sold or disposed of property
  // received in the exchange.
  bool taxpayer_disposed_of_property = 16;

  // Line 11a: The disposition was after the death of either related party.
  bool exception_disposition_after_death = 17;

  // Line 11b: The disposition was an involuntary conversion whose threat
  // arose after the exchange.
  bool exception_involuntary_conversion = 18;

  // Line 11c: Neither the exchange nor the disposition had tax avoidance as a
  // principal purpose. An explanation is attached.
  bool exception_no_tax_avoidance_purpose = 19;

  // -- Part III: Realized Gain or (Loss), Recognized Gain, and Basis of Like-Kind Property Received

  // Line 12: Fair market value of other (not like-kind) property given up.
  common.v1.Money fmv_of_other_property_given_up = 20;

  // Line 12a: Description of the other property given up.
  string other_property_given_up_description = 21;

  // Line 13: Adjusted basis of other property given up.
  common.v1.Money adjusted_basis_of_other_property_given_up = 22;

  // Line 14: Gain or (loss) recognized on other property given up. Line 13
  // subtracted from line 12, reported as if the exchange had been a sale.
  common.v1.Money gain_or_loss_on_other_property_given_up = 23;

  // Line 15: Cash received, fair market value of other property received, and
  // net liabilities assumed by the other party, reduced but not below zero by
  // exchange expenses.
  common.v1.Money net_boot_received = 24;

  // Line 15a: Description of the other property received.
  string other_property_received_description = 25;

  // Line 16: Fair market value of the like-kind property received.
  common.v1.Money fmv_of_like_kind_property_received = 26;

  // Line 17: Lines 15 and 16 added.
  common.v1.Money amount_realized = 27;

  // Line 18: Adjusted basis of the like-kind property given up, net amounts
  // paid to the other party, and exchange expenses not used on line 15.
  common.v1.Money adjusted_basis_of_like_kind_property_given_up = 28;

  // Line 19: Realized gain or (loss). Line 18 subtracted from line 17.
  common.v1.Money realized_gain_or_loss = 29;

  // Line 20: The smaller of line 15 or line 19, not less than zero.
  common.v1.Money tentative_recognized_gain = 30;

  // Line 21: Ordinary income under recapture rules. Also entered on Form 4797
  // line 16.
  common.v1.Money ordinary_recapture_gain = 31;

  // Line 22: Line 21 subtracted from line 20, not less than zero. Also entered
  // on Schedule D or Form 4797 unless the installment method applies.
  common.v1.Money recognized_capital_or_section_1231_gain = 32;

  // Line 23: Recognized gain. Lines 21 and 22 added.
  common.v1.Money total_recognized_gain = 33;

  // Line 24: Deferred gain or (loss). Line 23 subtracted from line 19.
  common.v1.Money deferred_gain_or_loss = 34;

  // Line 25: Basis of like-kind property received. Line 15 subtracted from
  // lines 18 and 23 added.
  common.v1.Money basis_of_like_kind_property_received = 35;

  // Line 25a: Basis of like-kind section 1250 property received.
  common.v1.Money basis_of_section_1250_property_received = 36;

  // Line 25b: Basis of like-kind section 1245, 1252, 1254 and 1255 property
  // received.
  common.v1.Money basis_of_section_1245_type_property_received = 37;

  // Line 25c: Basis of like-kind intangible property received.
  common.v1.Money basis_of_intangible_property_received = 38;

  // -- Part IV: Deferral of Gain From Section 1043 Conflict-of-Interest Sales

  // Line 26: The number from the upper right corner of the certificate of
  // divestiture.
  string certificate_of_divestiture_number = 39;

  // Line 27: Description of the divested property.
  string divested_property_description = 40;

  // Line 28: Description of the replacement property.
  string divestiture_replacement_property_description = 41;

  // Line 29: Date the divested property was sold.
  common.v1.Date date_divested_property_sold = 42;

  // Line 30: Sales price of the divested property.
  common.v1.Money divested_property_sales_price = 43;

  // Line 31: Basis of the divested property.
  common.v1.Money divested_property_basis = 44;

  // Line 32: Realized gain. Line 31 subtracted from line 30.
  common.v1.Money divestiture_realized_gain = 45;

  // Line 33: Cost of replacement property purchased within the replacement
  // period after the sale.
  common.v1.Money divestiture_replacement_property_cost = 46;

  // Line 34: Line 33 subtracted from line 30, not less than zero.
  common.v1.Money divestiture_sales_price_over_replacement_cost = 47;

  // Line 35: Ordinary income under recapture rules. Also entered on Form 4797
  // line 10.
  common.v1.Money divestiture_ordinary_recapture_gain = 48;

  // Line 36: Line 35 subtracted from line 34, not less than zero. Also entered
  // on Schedule D or Form 4797.
  common.v1.Money divestiture_recognized_capital_or_section_1231_gain = 49;

  // Line 37: Deferred gain. Lines 35 and 36 added, subtracted from line 32.
  common.v1.Money divestiture_deferred_gain = 50;

  // Line 38: Basis of replacement property. Line 37 subtracted from line 33.
  common.v1.Money divestiture_replacement_property_basis = 51;
}
