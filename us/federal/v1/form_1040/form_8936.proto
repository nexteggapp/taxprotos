// Form 8936, Clean Vehicle Credits, and Schedule A (Form 8936), Clean Vehicle
// Credit Amount.
//
// Used to figure the credit for new clean vehicles (section 30D), previously
// owned clean vehicles (section 25E) and qualified commercial clean vehicles
// (section 45W). A filer completes one Schedule A for each vehicle, and Form
// 8936 totals the Schedule A credit amounts by part.
syntax = "proto3";

package nexteggapp.taxprotos.us.federal.v1;

import "taxprotos/common/v1/date.proto";
import "taxprotos/common/v1/money.proto";
import "taxprotos/common/v1/quantity.proto";

option go_package = "github.com/nexteggapp/taxprotos/us/federal/v1/form_1040;form1040";

// Form8936 reports clean vehicle credits, with one Schedule A per vehicle.
message Form8936 {
  // VehicleScheduleA is one Schedule A (Form 8936), for one vehicle.
  //
  // Schedule A numbers its lines from 1 independently of Form 8936. The yes/no
  // eligibility questions on lines 8a-8e and 13a-13g are not modelled: a
  // vehicle that fails one has no credit amount.
  message VehicleScheduleA {
    // Part I, line 1a: Model year of the vehicle.
    string year = 1;

    // Part I, line 1b: Make of the vehicle.
    string make = 2;

    // Part I, line 1c: Model of the vehicle.
    string model = 3;

    // Part I, line 2: Vehicle identification number (VIN).
    string vin = 4;

    // Part I, line 3: Date the vehicle was placed in service.
    common.v1.Date date_placed_in_service = 5;

    // Part I, line 4a: Whether the credit was transferred to the dealer at the
    // time of sale.
    bool credit_transferred_to_dealer = 6;

    // Part I, line 4a: Transferred amount shown on the seller's report.
    common.v1.Money credit_amount_transferred_to_dealer = 7;

    // Part I, line 4b: Checked when line 8a, 8d, 13a or 13c directs it, so the
    // transferred amount is repaid on Schedule 2.
    bool transferred_credit_repayable = 8;

    // Part I, line 5: Whether the vehicle is a new clean vehicle that qualifies
    // for Parts II and III.
    bool new_clean_vehicle = 9;

    // Part I, line 6: Whether the vehicle is a previously owned clean vehicle
    // that qualifies for Part IV.
    bool previously_owned_clean_vehicle = 10;

    // Part I, line 7: Whether the vehicle is a qualified commercial clean
    // vehicle that qualifies for Part V.
    bool commercial_clean_vehicle = 11;

    // Part II, line 9: Tentative credit amount for a new clean vehicle.
    common.v1.Money new_vehicle_tentative_credit = 12;

    // Part II, line 10: Business/investment use percentage.
    common.v1.Quantity business_use_percentage = 13;

    // Part II, line 11: Line 9 multiplied by line 10. Included on Form 8936
    // line 6.
    common.v1.Money business_use_credit = 14;

    // Part III, line 12: Line 9 minus line 11. Included on Form 8936 line 9.
    common.v1.Money personal_use_credit = 15;

    // Part IV, line 14: Sales price of the previously owned vehicle.
    common.v1.Money sales_price = 16;

    // Part IV, line 15: Line 14 multiplied by the rate the form prints.
    common.v1.Money sales_price_times_rate = 17;

    // Part IV, line 16: Maximum credit amount for one previously owned vehicle,
    // as the form prints it.
    common.v1.Money previously_owned_maximum_credit = 18;

    // Part IV, line 17: The smaller of lines 15 and 16. Included on Form 8936
    // line 14.
    common.v1.Money previously_owned_credit = 19;

    // Part V, line 18a: IRS-issued registration number for the vehicle, when
    // making an elective payment election.
    string elective_payment_registration_number = 20;

    // Part V, line 18d: Whether the vehicle is also powered in part by gas or
    // diesel. It decides the rate on line 22.
    bool partly_gas_or_diesel_powered = 21;

    // Part V, line 18e: Gross vehicle weight rating, in pounds.
    int64 gross_vehicle_weight_rating_pounds = 22;

    // Part V, line 19: Cost or other basis of the vehicle.
    common.v1.Money cost_or_basis = 23;

    // Part V, line 20: Section 179 expense deduction.
    common.v1.Money section_179_deduction = 24;

    // Part V, line 21: Line 19 minus line 20.
    common.v1.Money basis_after_section_179 = 25;

    // Part V, line 22: Line 21 multiplied by the rate the form prints, which
    // depends on line 18d.
    common.v1.Money basis_times_rate = 26;

    // Part V, line 23: Incremental cost of the vehicle.
    common.v1.Money incremental_cost = 27;

    // Part V, line 24: The smaller of lines 22 and 23.
    common.v1.Money commercial_tentative_credit = 28;

    // Part V, line 25: Maximum credit, which depends on the gross vehicle
    // weight rating.
    common.v1.Money commercial_maximum_credit = 29;

    // Part V, line 26: The smaller of lines 24 and 25. Included on Form 8936
    // line 19.
    common.v1.Money commercial_credit = 30;
  }

  // The tax year the form applies to.
  int32 tax_year = 1;

  // Name(s) shown on return.
  string filer_name = 2;

  // Identifying number of the filer.
  string filer_tin = 3;

  // Part I, line 1a: Adjusted gross income for the tax year, from Form 1040
  // line 11a.
  common.v1.Money current_year_agi = 4;

  // Part I, line 1b: Income from Puerto Rico excluded in the tax year.
  common.v1.Money current_year_puerto_rico_excluded_income = 5;

  // Part I, line 1c: Amount from Form 2555 line 45 for the tax year.
  common.v1.Money current_year_foreign_earned_income_exclusion = 6;

  // Part I, line 1d: Amount from Form 2555 line 50 for the tax year.
  common.v1.Money current_year_foreign_housing_exclusion = 7;

  // Part I, line 1e: Amount from Form 4563 line 15 for the tax year.
  common.v1.Money current_year_american_samoa_exclusion = 8;

  // Part I, line 2: Modified adjusted gross income for the tax year, lines 1a
  // through 1e added.
  common.v1.Money current_year_modified_agi = 9;

  // Part I, line 3a: Adjusted gross income for the prior year, from that
  // year's Form 1040.
  common.v1.Money prior_year_agi = 10;

  // Part I, line 3b: Income from Puerto Rico excluded in the prior year.
  common.v1.Money prior_year_puerto_rico_excluded_income = 11;

  // Part I, line 3c: Amount from the prior year's Form 2555 line 45.
  common.v1.Money prior_year_foreign_earned_income_exclusion = 12;

  // Part I, line 3d: Amount from the prior year's Form 2555 line 50.
  common.v1.Money prior_year_foreign_housing_exclusion = 13;

  // Part I, line 3e: Amount from the prior year's Form 4563 line 15.
  common.v1.Money prior_year_american_samoa_exclusion = 14;

  // Part I, line 4: Modified adjusted gross income for the prior year, lines
  // 3a through 3e added.
  common.v1.Money prior_year_modified_agi = 15;

  // Part I, line 5: Filing status for the prior year, as the form's chart
  // abbreviates it: "S", "MFS", "HOH", "MFJ" or "QSS".
  string prior_year_filing_status = 16;

  // Part II, line 6: Total of the Part II credit amounts from Schedule(s) A.
  common.v1.Money business_new_vehicle_credit_from_schedules = 17;

  // Part II, line 7: New clean vehicle credit from partnerships and S
  // corporations.
  common.v1.Money new_vehicle_credit_from_passthroughs = 18;

  // Part II, line 8: Business/investment use part of the credit, lines 6 and 7
  // added. Carries to Form 3800 Part III line 1y.
  common.v1.Money business_new_vehicle_credit = 19;

  // Part III, line 9: Total of the Part III credit amounts from Schedule(s) A.
  common.v1.Money personal_new_vehicle_credit_from_schedules = 20;

  // Part III, line 10: Amount from Form 1040 line 18.
  common.v1.Money part_iii_tax_before_credits = 21;

  // Part III, line 11: Personal credits from Form 1040 that are taken before
  // this one.
  common.v1.Money part_iii_prior_personal_credits = 22;

  // Part III, line 12: Line 10 minus line 11, not less than zero.
  common.v1.Money part_iii_tax_liability_limit = 23;

  // Part III, line 13: Personal use part of the credit, the smaller of lines 9
  // and 12. Carries to Schedule 3 line 6f.
  common.v1.Money personal_new_vehicle_credit = 24;

  // Part IV, line 14: Total of the Part IV credit amounts from Schedule(s) A.
  common.v1.Money previously_owned_credit_from_schedules = 25;

  // Part IV, line 15: Amount from Form 1040 line 18.
  common.v1.Money part_iv_tax_before_credits = 26;

  // Part IV, line 16: Personal credits from Form 1040 that are taken before
  // this one.
  common.v1.Money part_iv_prior_personal_credits = 27;

  // Part IV, line 17: Line 15 minus line 16, not less than zero.
  common.v1.Money part_iv_tax_liability_limit = 28;

  // Part IV, line 18: Previously owned clean vehicle credit, the smaller of
  // lines 14 and 17. Carries to Schedule 3 line 6m.
  common.v1.Money previously_owned_clean_vehicle_credit = 29;

  // Part V, line 19: Total of the Part V credit amounts from Schedule(s) A.
  common.v1.Money commercial_credit_from_schedules = 30;

  // Part V, line 20: Qualified commercial clean vehicle credit from
  // partnerships and S corporations.
  common.v1.Money commercial_credit_from_passthroughs = 31;

  // Part V, line 21: Lines 19 and 20 added. Carries to Form 3800 Part III line
  // 1aa.
  common.v1.Money commercial_clean_vehicle_credit = 32;

  // One Schedule A (Form 8936) per vehicle placed in service during the year.
  repeated VehicleScheduleA vehicles = 33;
}
