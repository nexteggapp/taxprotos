// Form 8615, Tax for Certain Children Who Have Unearned Income ("Kiddie Tax").
//
// Used to figure the child's tax on unearned income above the annual
// threshold at the parent's tax rate under IRC section 1(g).
syntax = "proto3";

package nexteggapp.taxprotos.us.federal.v1;

import "taxprotos/common/v1/money.proto";
import "taxprotos/common/v1/quantity.proto";

option go_package = "github.com/nexteggapp/taxprotos/us/federal/v1/form_1040;form1040";

// Form8615 reports the Kiddie Tax computation across Parts I, II, and III.
message Form8615 {
  // The tax year the form applies to.
  int32 tax_year = 1;

  // Child's name shown on return.
  string child_name = 2;

  // Child's Social Security number.
  string child_tin = 3;

  // Line A: Parent's name (first, initial, and last).
  string parent_name = 4;

  // Line B: Parent's Social Security number.
  string parent_tin = 5;

  // Line C: Parent's filing status.
  string parent_filing_status = 6;

  // -- Part I: Child's Net Unearned Income ---------------------------------

  // Line 1: Child's unearned income.
  common.v1.Money child_unearned_income = 7;

  // Line 2: The standard unearned income threshold when the child did not
  // itemize, or the instructions' amount when the child did.
  common.v1.Money unearned_income_threshold_or_deductions = 8;

  // Line 3: Line 2 subtracted from line 1. Zero or less ends the form, which is
  // still attached to the child's return.
  common.v1.Money unearned_income_above_threshold = 9;

  // Line 4: Child's taxable income from Form 1040 or 1040-NR line 15.
  common.v1.Money child_taxable_income = 10;

  // Line 5: Net unearned income, the smaller of line 3 or line 4.
  common.v1.Money net_unearned_income = 11;

  // -- Part II: Tentative Tax Based on the Tax Rate of the Parent ----------

  // Line 6: Parent's taxable income from Form 1040 or 1040-NR line 15, not
  // less than zero.
  common.v1.Money parent_taxable_income = 12;

  // Line 7: Total of line 5 from the Forms 8615 of the parent's other
  // children.
  common.v1.Money other_children_net_unearned_income = 13;

  // Line 8: Lines 5, 6 and 7 added.
  common.v1.Money combined_taxable_income = 14;

  // Line 9: Tax on line 8 at the parent's filing status.
  common.v1.Money tax_on_combined_taxable_income = 15;

  // Line 9 checkbox: the Qualified Dividends and Capital Gain Tax Worksheet,
  // Schedule D Tax Worksheet or Schedule J figured the line 9 tax.
  bool combined_tax_used_worksheet_or_schedule_j = 16;

  // Line 10: Parent's tax from Form 1040 or 1040-NR line 16, less any
  // alternative minimum tax, and excluding tax from Form 4972, Form 8814 and
  // education credit recapture.
  common.v1.Money parent_tax = 17;

  // Line 10 checkbox: the Qualified Dividends and Capital Gain Tax Worksheet,
  // Schedule D Tax Worksheet or Schedule J figured the parent's tax.
  bool parent_tax_used_worksheet_or_schedule_j = 18;

  // Line 11: Line 10 subtracted from line 9. Also entered on line 13 when line
  // 7 is blank.
  common.v1.Money total_parental_tax_on_children_unearned_income = 19;

  // Line 12a: Lines 5 and 7 added.
  common.v1.Money total_children_net_unearned_income = 20;

  // Line 12b: Line 5 divided by line 12a, as a decimal of at least three
  // places.
  common.v1.Quantity child_share_of_net_unearned_income = 21;

  // Line 13: Line 11 times line 12b.
  common.v1.Money child_share_of_parental_tax = 22;

  // -- Part III: Child's Tax -----------------------------------------------

  // Line 14: Line 5 subtracted from line 4.
  common.v1.Money child_taxable_income_less_net_unearned_income = 23;

  // Line 15: Tax on line 14 at the child's filing status. Zero when lines 4
  // and 5 are the same.
  common.v1.Money tax_on_child_taxable_income_less_net_unearned_income = 24;

  // Line 15 checkbox: the Qualified Dividends and Capital Gain Tax Worksheet,
  // Schedule D Tax Worksheet or Schedule J figured the line 15 tax.
  bool child_rate_tax_used_worksheet_or_schedule_j = 25;

  // Line 16: Lines 13 and 15 added.
  common.v1.Money combined_kiddie_tax = 26;

  // Line 17: Tax on line 4 at the child's filing status.
  common.v1.Money regular_tax_on_child_taxable_income = 27;

  // Line 17 checkbox: the Qualified Dividends and Capital Gain Tax Worksheet,
  // Schedule D Tax Worksheet or Schedule J figured the line 17 tax.
  bool regular_tax_used_worksheet_or_schedule_j = 28;

  // Line 18: Child's tax, the larger of line 16 or line 17. Carries to the
  // child's Form 1040 or 1040-NR line 16.
  common.v1.Money child_tax = 29;
}
