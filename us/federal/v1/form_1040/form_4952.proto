// Form 4952, Investment Interest Expense Deduction.
//
// Used by individuals, estates, and trusts to figure the amount of investment
// interest expense that can be deducted for the current tax year on Schedule A
// (Form 1040) line 9 and the amount of disallowed investment interest expense
// that can be carried forward to future tax years under IRC Section 163(d).
syntax = "proto3";

package nexteggapp.taxprotos.us.federal.v1;

import "taxprotos/common/v1/money.proto";

option go_package = "github.com/nexteggapp/taxprotos/us/federal/v1/form_1040;form1040";

// Form4952 reports total investment interest expense (Part I), net investment income (Part II), and the allowable deduction and carryforward (Part III).
message Form4952 {
  // The tax year the form applies to.
  int32 tax_year = 1;

  // Name(s) shown on return.
  string filer_name = 2;

  // Identifying number (SSN or EIN).
  string filer_tin = 3;

  // -- Part I: Total Investment Interest Expense ---------------------------

  // Line 1: Investment interest expense paid or accrued in the tax year.
  common.v1.Money current_year_investment_interest_expense = 4;

  // Line 2: Disallowed investment interest expense carried from the prior
  // year's Form 4952 line 7.
  common.v1.Money prior_year_disallowed_investment_interest = 5;

  // Line 3: Total investment interest expense. Lines 1 and 2 added.
  common.v1.Money total_investment_interest_expense = 6;

  // -- Part II: Net Investment Income --------------------------------------

  // Line 4a: Gross income from property held for investment, excluding net
  // gain from its disposition.
  common.v1.Money gross_investment_income = 7;

  // Line 4b: Qualified dividends included on line 4a.
  common.v1.Money qualified_dividends_in_gross_investment_income = 8;

  // Line 4c: Line 4a minus line 4b.
  common.v1.Money gross_investment_income_less_qualified_dividends = 9;

  // Line 4d: Net gain from the disposition of property held for investment.
  common.v1.Money net_gain_from_investment_property_dispositions = 10;

  // Line 4e: The smaller of line 4d or net capital gain from the disposition
  // of property held for investment.
  common.v1.Money net_capital_gain_from_investment_property = 11;

  // Line 4f: Line 4d minus line 4e.
  common.v1.Money investment_gain_less_net_capital_gain = 12;

  // Line 4g: The amount from lines 4b and 4e elected to be included in
  // investment income.
  common.v1.Money elected_qualified_dividends_and_capital_gain = 13;

  // Line 4h: Investment income. Lines 4c, 4f, and 4g added.
  common.v1.Money total_investment_income = 14;

  // Line 5: Investment expenses other than interest.
  common.v1.Money investment_expenses = 15;

  // Line 6: Net investment income. Line 4h minus line 5, not less than zero.
  common.v1.Money net_investment_income = 16;

  // -- Part III: Investment Interest Expense Deduction ---------------------

  // Line 7: Disallowed investment interest expense carried forward to the next
  // year. Line 3 minus line 6, not less than zero.
  common.v1.Money disallowed_investment_interest_carryforward = 17;

  // Line 8: Investment interest expense deduction. The smaller of line 3 or
  // line 6. Generally carries to Schedule A line 9.
  common.v1.Money investment_interest_expense_deduction = 18;
}
