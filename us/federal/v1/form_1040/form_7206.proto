// Form 7206, Self-Employed Health Insurance Deduction.
//
// Used to figure the amount of the self-employed health insurance deduction to
// report on Schedule 1 (Form 1040) line 17. One form per trade or business
// under which an insurance plan is established.
syntax = "proto3";

package nexteggapp.taxprotos.us.federal.v1;

import "taxprotos/common/v1/money.proto";
import "taxprotos/common/v1/quantity.proto";

option go_package = "github.com/nexteggapp/taxprotos/us/federal/v1/form_1040;form1040";

// Form7206 reports the Self-Employed Health Insurance Deduction calculation.
message Form7206 {
  // The tax year the form applies to.
  int32 tax_year = 1;

  // Name(s) shown on return.
  string filer_name = 2;

  // Taxpayer identification number of filer.
  string filer_tin = 3;

  // Line 1: Total paid during the year for health insurance coverage established under the business, other than long-term care.
  common.v1.Money health_insurance_premiums_paid = 4;

  // Line 2: Qualified long-term care insurance premiums, each person's limited by the age-based amount the form states.
  common.v1.Money qualified_long_term_care_premiums = 5;

  // Line 3: Lines 1 and 2.
  common.v1.Money total_qualified_insurance_premiums = 6;

  // Line 4: Net profit and any other earned income from the trade or business under which the plan is established.
  common.v1.Money business_net_profit_and_earned_income = 7;

  // Line 5: Total net profits from all profitable businesses.
  common.v1.Money total_net_profit_from_all_businesses = 8;

  // Line 6: Line 4 divided by line 5.
  common.v1.Quantity business_share_of_net_profit = 9;

  // Line 7: Schedule 1 line 15 (deductible part of self-employment tax) times line 6.
  common.v1.Money attributable_se_tax_deduction = 10;

  // Line 8: Line 4 minus line 7.
  common.v1.Money net_business_income_after_se_tax_deduction = 11;

  // Line 9: Schedule 1 line 16 (SEP, SIMPLE, and qualified plans) attributable to this business.
  common.v1.Money attributable_retirement_plan_deduction = 12;

  // Line 10: Line 8 minus line 9.
  common.v1.Money earned_income_limit = 13;

  // Line 11: Medicare wages (Form W-2 box 5) from the S corporation under which the plan is established, for a shareholder treated as self-employed.
  common.v1.Money s_corporation_medicare_wages = 14;

  // Line 12: Amount from Form 2555 line 45 attributable to line 4 or line 11.
  common.v1.Money foreign_earned_income_exclusion_attributable = 15;

  // Line 13: Line 10 or line 11, whichever applies, minus line 12.
  common.v1.Money deduction_limit = 16;

  // Line 14: Self-employed health insurance deduction (smaller of line 3 or line 13). Carries to Schedule 1 line 17.
  common.v1.Money self_employed_health_insurance_deduction = 17;
}
