// Form 2441, Child and Dependent Care Expenses.
//
// Attached to Form 1040 to claim the credit for child and dependent care
// expenses or to figure the taxable or excludable dependent care benefits
// received from an employer.
syntax = "proto3";

package nexteggapp.taxprotos.us.federal.v1;

import "taxprotos/common/v1/money.proto";
import "taxprotos/common/v1/quantity.proto";

option go_package = "github.com/nexteggapp/taxprotos/us/federal/v1/form_1040;form1040";

// Form2441 reports child and dependent care expenses and dependent care benefits.
message Form2441 {
  // CareProvider represents one person or organization that provided care in Part I line 1.
  message CareProvider {
    // Column (a): Care provider's name.
    string provider_name = 1;

    // Column (b): Care provider's address (number, street, apt. no., city, state, and ZIP code).
    string provider_address = 2;

    // Column (c): Identifying number (SSN or EIN).
    string identifying_number = 3;

    // Column (c): Whether the identifying number is given as "Tax-exempt"
    // because the provider is a tax-exempt organization.
    bool is_tax_exempt = 4;

    // Column (d): Whether the care provider was the filer's household employee
    // in the tax year.
    bool is_household_employee = 5;

    // Column (e): Amount paid to the care provider.
    common.v1.Money amount_paid = 6;
  }

  // QualifyingPerson represents one qualifying child or dependent in Part II line 2.
  message QualifyingPerson {
    // Column (a): Qualifying person's first and last name.
    string person_name = 1;

    // Column (b): Qualifying person's Social Security number.
    string person_ssn = 2;

    // Column (c): Check if the qualifying person was over age 12 and disabled.
    bool over_age_12_and_disabled = 3;

    // Column (d): Qualified expenses incurred and paid in the tax year for the
    // person.
    common.v1.Money qualified_expenses = 4;
  }

  // The tax year the form applies to.
  int32 tax_year = 1;

  // Name(s) shown on return.
  string filer_name = 2;

  // Social Security number of filer.
  string filer_tin = 3;

  // Checkbox A: Married filing separately and meets the requirements for
  // claiming the credit anyway.
  bool married_filing_separately_exception_applies = 4;

  // Checkbox B: The filer or spouse was a student or disabled and deemed
  // monthly income is entered.
  bool deemed_income_for_student_or_disabled_spouse = 5;

  // -- Part I: Persons or Organizations Who Provided the Care --------------

  // Part I: More than three care providers; the rest are listed separately.
  bool more_than_three_care_providers = 6;

  // Line 1: Care providers.
  repeated CareProvider care_providers = 7;

  // Part I: Whether the filer received dependent care benefits, which decides
  // whether Part III is completed.
  bool received_dependent_care_benefits = 8;

  // -- Part II: Credit for Child and Dependent Care Expenses ---------------

  // Line 2: More than three qualifying persons; the rest are listed
  // separately.
  bool more_than_three_qualifying_persons = 9;

  // Line 2: Qualifying persons and qualified expenses per person.
  repeated QualifyingPerson qualifying_persons = 10;

  // Line 3: Qualified expenses. Column (d) of line 2 added, capped at the
  // dollar limit for the number of qualifying persons, or line 31 when Part
  // III is completed.
  common.v1.Money eligible_care_expenses = 11;

  // Line 4: The filer's earned income.
  common.v1.Money taxpayer_earned_income = 12;

  // Line 5: The spouse's earned income on a joint return, otherwise line 4.
  common.v1.Money spouse_earned_income = 13;

  // Line 6: The smallest of lines 3, 4, or 5, not less than zero.
  common.v1.Money smallest_of_expenses_or_earned_income = 14;

  // Line 7: Adjusted gross income from Form 1040 line 11a.
  common.v1.Money adjusted_gross_income = 15;

  // Line 8: The decimal amount from the table on the form that applies to
  // line 7.
  common.v1.Quantity applicable_credit_rate = 16;

  // Line 9a: Line 6 multiplied by line 8.
  common.v1.Money tentative_credit = 17;

  // Line 9b: Credit for prior-year expenses paid in the tax year.
  common.v1.Money prior_year_expense_credit = 18;

  // Line 9c: Lines 9a and 9b added.
  common.v1.Money total_tentative_credit = 19;

  // Line 10: Tax liability limit from the Credit Limit Worksheet.
  common.v1.Money tax_liability_limit = 20;

  // Line 11: Credit for child and dependent care expenses. The smaller of line
  // 9c or line 10. Carries to Schedule 3 line 2.
  common.v1.Money credit_for_child_and_dependent_care_expenses = 21;

  // -- Part III: Dependent Care Benefits -----------------------------------

  // Line 12: Dependent care benefits received in the tax year.
  common.v1.Money dependent_care_benefits_received = 22;

  // Line 13: Benefits carried over from the prior year and used during the
  // grace period.
  common.v1.Money carryover_from_prior_year = 23;

  // Line 14: Benefits forfeited or carried forward to the next year. Printed
  // in parentheses.
  common.v1.Money forfeited_or_carried_forward_benefits = 24;

  // Line 15: Lines 12 through 14 combined.
  common.v1.Money net_dependent_care_benefits = 25;

  // Line 16: Qualified expenses incurred in the tax year for the care of the
  // qualifying persons.
  common.v1.Money total_qualified_expenses_for_benefits = 26;

  // Line 17: The smaller of line 15 or line 16.
  common.v1.Money smaller_of_benefits_or_expenses = 27;

  // Line 18: The filer's earned income.
  common.v1.Money part_iii_taxpayer_earned_income = 28;

  // Line 19: The spouse's earned income on a joint return, otherwise line 18.
  common.v1.Money part_iii_spouse_earned_income = 29;

  // Line 20: The smallest of lines 17, 18, or 19, not less than zero.
  common.v1.Money smallest_of_benefits_expenses_or_earned_income = 30;

  // Line 21: The statutory exclusion limit, reduced for married filing
  // separately and capped at the plan maximum.
  common.v1.Money statutory_exclusion_limit = 31;

  // Line 22: The part of lines 12 and 13 from the filer's sole proprietorship
  // or partnership, or zero.
  common.v1.Money self_employed_dependent_care_benefits = 32;

  // Line 23: Line 15 minus line 22.
  common.v1.Money employee_dependent_care_benefits = 33;

  // Line 24: Deductible benefits. The smallest of lines 20, 21, or 22.
  common.v1.Money deductible_self_employed_benefits = 34;

  // Line 25: Excluded benefits. The smaller of lines 20 or 21, less line 24,
  // not less than zero.
  common.v1.Money excluded_dependent_care_benefits = 35;

  // Line 26: Taxable benefits. Line 23 minus line 25, not less than zero.
  // Carries to Form 1040 line 1e.
  common.v1.Money taxable_dependent_care_benefits = 36;

  // Line 27: The dollar limit on qualified expenses for the number of
  // qualifying persons.
  common.v1.Money maximum_expense_limit_before_benefits = 37;

  // Line 28: Lines 24 and 25 added.
  common.v1.Money total_deductible_and_excluded_benefits = 38;

  // Line 29: Line 27 minus line 28.
  common.v1.Money remaining_expense_limit_after_benefits = 39;

  // Line 30: Column (d) of line 2 added, excluding benefits shown on line 28.
  common.v1.Money net_qualified_expenses_for_credit = 40;

  // Line 31: The smaller of line 29 or line 30. Carries to line 3.
  common.v1.Money allowable_expenses_carried_to_part_ii = 41;
}
