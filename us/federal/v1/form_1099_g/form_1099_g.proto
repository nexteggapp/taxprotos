// Form 1099-G, Certain Government Payments.
//
// A federal, state or local government sends it when it paid unemployment
// compensation, or refunded, credited or offset $10 or more of state or local
// income tax.
//
// Boxes and Amount Codes are in mapping.textproto beside this file, keyed by
// tax year, per docs/form-schemas.md.
syntax = "proto3";

package nexteggapp.taxprotos.us.federal.v1;

import "taxprotos/common/v1/annotations.proto";
import "taxprotos/common/v1/money.proto";
import "taxprotos/common/v1/party.proto";

option go_package = "github.com/nexteggapp/taxprotos/us/federal/v1/form_1099_g;form1099g";

// Form1099G is what a Form 1099-G states.
message Form1099G {
  option (common.v1.fdx_entity) = "Tax1099G";
  option (common.v1.fdx_version) = "5.0";

  // The calendar year the form reports on, as four digits.
  int32 tax_year = 1 [(common.v1.fdx_field) = "taxYear"];

  // The government agency that paid or refunded the amounts.
  nexteggapp.taxprotos.common.v1.Party payer = 2;

  // Unemployment compensation paid in the year, including any federal tax
  // withheld from it.
  nexteggapp.taxprotos.common.v1.Money unemployment_compensation = 3 [
    (common.v1.fdx_field) = "unemploymentCompensation"
  ];

  // State or local income tax refunded, credited or offset in the year. It
  // is income only to a household that itemised in [refund_tax_year].
  nexteggapp.taxprotos.common.v1.Money state_or_local_refund = 4 [
    (common.v1.fdx_field) = "stateOrLocalTaxRefund"
  ];

  // The tax year [state_or_local_refund] is for, as four digits. Unset when
  // it is the year before [tax_year].
  int32 refund_tax_year = 5 [(common.v1.fdx_field) = "refundTaxYear"];

  // Federal income tax withheld, by backup withholding or at the recipient's
  // request.
  nexteggapp.taxprotos.common.v1.Money federal_tax_withheld = 6 [
    (common.v1.fdx_field) = "federalTaxWithheld"
  ];

  // The recipient the form reports on.
  nexteggapp.taxprotos.common.v1.Party recipient = 7;

  // The account number the form prints, where it has one. Text, because it
  // can carry leading zeroes and letters.
  string account_number = 8 [(common.v1.fdx_field) = "accountNumber"];

  // The form is marked CORRECTED, which means it replaces one already sent.
  bool corrected = 9 [(common.v1.fdx_field) = "corrected"];

  // One row per state the form reports withholding for.
  repeated nexteggapp.taxprotos.common.v1.StateTaxWithholding state_tax_withholding = 10 [(common.v1.fdx_field) = "stateTaxWithholding"];

  // Payments under the Reemployment Trade Adjustment Assistance program.
  nexteggapp.taxprotos.common.v1.Money rtaa_payments = 11;

  // Taxable grants from a federal, state or local government.
  nexteggapp.taxprotos.common.v1.Money taxable_grants = 12;

  // Agricultural subsidy payments from the Department of Agriculture.
  nexteggapp.taxprotos.common.v1.Money agriculture_payments = 13;

  // The refund in [state_or_local_refund] is of a tax that applies only to
  // income from a trade or business.
  bool refund_is_trade_or_business_income = 14;

  // Market gain on Commodity Credit Corporation loans repaid in the year.
  nexteggapp.taxprotos.common.v1.Money market_gain = 15;
}
