  // Line 52. Amended returns only.
  nexteggapp.taxprotos.common.v1.Money amount_paid_with_original_return = 62 [(common.v1.fdx_absent) = true];

  // Line 53.
  nexteggapp.taxprotos.common.v1.Money total_payments = 63 [(common.v1.fdx_absent) = true];

