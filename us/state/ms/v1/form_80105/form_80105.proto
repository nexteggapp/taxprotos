// Form 80-105, Mississippi Resident Individual Income Tax Return.
//
// Non-residents and part-year residents file Form 80-205 instead. Only the
// full-year resident's return is modelled here.
//
// Line numbers are in mapping.textproto beside this file, keyed by tax year,
// per docs/form-schemas.md. Verified against the 2025 Form 80-105; testdata
// holds the text extracted from the published PDF and coverage_test.go asserts
// every line a mapping claims appears on it.
//
// # Two columns
//
// From line 13 down, and on page 2, the form has a column for the taxpayer (A)
// and one for the spouse (B). A married couple may file a "joint" return, with
// everything in column A, or a "combined" return, with each spouse's income in
// their own column, so that each gets the first $10,000 of taxable income
// untaxed. Each column is its own field, prefixed taxpayer_ or spouse_.
//
// # Exemptions and deductions
//
// Mississippi does not start from federal adjusted gross income. It rebuilds
// income on page 2, then takes off a standard or itemized deduction (line 14)
// and a fixed exemption for the filing status, age, blindness and dependents
// (lines 10 to 12, carried to line 15).
syntax = "proto3";

package nexteggapp.taxprotos.us.state.ms.v1;

import "taxprotos/common/v1/annotations.proto";
import "taxprotos/common/v1/money.proto";
import "taxprotos/common/v1/party.proto";

option go_package = "github.com/nexteggapp/taxprotos/us/state/ms/v1/form_80105;form80105";

// FilingStatus is the status checked on lines 1 to 5.
enum FilingStatus {
  FILING_STATUS_UNSPECIFIED = 0;
  // Line 1: married, combined or joint return.
  FILING_STATUS_MARRIED_JOINT_OR_COMBINED = 1;
  // Line 2: married, spouse died in the tax year.
  FILING_STATUS_MARRIED_SPOUSE_DIED = 2;
  // Line 3: married, filing separate returns.
  FILING_STATUS_MARRIED_FILING_SEPARATELY = 3;
  // Line 4: head of family.
  FILING_STATUS_HEAD_OF_FAMILY = 4;
  // Line 5: single.
  FILING_STATUS_SINGLE = 5;
}

